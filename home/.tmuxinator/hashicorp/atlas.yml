name: hashicorp/atlas
root: ~/Code/hashicorp/atlas
pre_window:
  - nvm use
  - artifactory_auth
windows:
  - editor:
      panes:
        - editor: nvim -c "Telescope find_files"
  - services:
      layout: tiled
      panes:
        - frontend: cd frontend/atlas && pnpm install && pnpm start
        - backend: syrup stack up
        - console: bundle
